x-app-image: &app-image
  image: ${APP_IMAGE:-mafia-dashboard:local}

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mafia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mafia-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-mafia}
    volumes:
      - mafia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *bounded-logging

  migrate:
    <<: *app-image
    command: ["node", "apps/server/dist/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILD_INDEX: ${APP_BUILD_INDEX:-0}
        VITE_YOUTUBE_PLAYLIST_ID: ${VITE_YOUTUBE_PLAYLIST_ID:-}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      STATIC_DIR: /app/apps/web/dist
      PORT: 3000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      MUSIC_TOKEN_ENCRYPTION_KEY: ${MUSIC_TOKEN_ENCRYPTION_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s
    restart: unless-stopped
    logging: *bounded-logging

volumes:
  mafia-postgres:
