name: One-time PostgreSQL import
run-name: PostgreSQL ${{ inputs.mode }} — ${{ inputs.archive }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Export a new archive or apply an approved archive
        type: choice
        options: [export, apply]
        required: true
      archive:
        description: Owned private container (migration- followed by 32 lowercase hex characters)
        type: string
        required: true
      sha256:
        description: Exact validated manifest SHA-256 (apply only; empty for export)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run exact one-time migration job
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_ARCHIVE: ${{ inputs.archive }}
          MIGRATION_SHA256: ${{ inputs.sha256 }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          POSTGRES_PASSWORD: ${{ inputs.mode == 'export' && secrets.POSTGRES_PASSWORD || '' }}
        run: node scripts/production-postgres-migration.mjs
