name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing
        type: boolean
        default: true
      deploy_infrastructure:
        description: Force infrastructure deployment (otherwise detect changes automatically)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_INDEX=${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push immutable image
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          push_output=$(docker push "$IMAGE_REF" 2>&1)
          printf '%s\n' "$push_output"
          if [[ "$push_output" =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
            digest="${BASH_REMATCH[1]}"
          else
            echo "Docker push did not report an image digest" >&2
            exit 1
          fi
          remote_digest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          if [[ "$remote_digest" != "$digest" ]]; then
            echo "Published tag no longer resolves to the pushed digest" >&2
            exit 1
          fi
          image_ref="${IMAGE_REF%:*}@$digest"
          echo "image=$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && vars.AZURE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_DATABASE_NAME: ${{ vars.AZURE_DATABASE_NAME }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MUSIC_TOKEN_ENCRYPTION_KEY: ${{ secrets.MUSIC_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing AZURE_RESOURCE_GROUP}"
          : "${AZURE_LOCATION:?Missing AZURE_LOCATION}"
          : "${AZURE_NAME_PREFIX:?Missing AZURE_NAME_PREFIX}"
          : "${AZURE_DATABASE_NAME:?Missing AZURE_DATABASE_NAME}"
          if [[ ! "$AZURE_DATABASE_NAME" =~ ^[a-z][a-z0-9_]{0,62}$ ]]; then
            echo "AZURE_DATABASE_NAME must be 1-63 lowercase letters, digits, or underscores, starting with a letter" >&2
            exit 1
          fi
          : "${GHCR_USERNAME:?Missing GHCR_USERNAME}"
          : "${GHCR_TOKEN:?Missing GHCR_PULL_TOKEN}"
          : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
      - name: Select infrastructure deployment
        id: plan
        env:
          DEPLOY_INFRASTRUCTURE: ${{ inputs.deploy_infrastructure == true }}
        run: node scripts/azure-deployment-plan.mjs
      - name: Create resource group
        if: steps.plan.outputs.deploy == 'true'
        run: >-
          az group create
          --name "$AZURE_RESOURCE_GROUP"
          --location "$AZURE_LOCATION"
          --output none
      - name: Validate foundation
        if: steps.plan.outputs.deploy == 'true'
        env:
          FOUNDATION_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        run: |
          set -Eeuo pipefail
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              databaseName="$AZURE_DATABASE_NAME" \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              foundationFingerprint="$FOUNDATION_FINGERPRINT" \
              postgresPassword="$POSTGRES_PASSWORD" \
            --output none
      - name: Deploy foundation
        id: foundation
        if: steps.plan.outputs.deploy == 'true'
        env:
          FOUNDATION_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          outputs=$(az deployment group create \
            --name "mafia-foundation" \
            --mode Incremental \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              databaseName="$AZURE_DATABASE_NAME" \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              foundationFingerprint="$FOUNDATION_FINGERPRINT" \
              postgresPassword="$POSTGRES_PASSWORD" \
            --query properties.outputs \
            --output json)
          database_name=$(jq -er '.deployedDatabaseName.value' <<<"$outputs")
          [[ "$database_name" == "$AZURE_DATABASE_NAME" ]]
          jq --exit-status --arg fingerprint "$FOUNDATION_FINGERPRINT" \
            '.foundationFingerprint.value == $fingerprint' <<<"$outputs" >/dev/null
      - name: Deploy application
        id: app
        env:
          APP_NAME: ${{ steps.plan.outputs.app_name }}
          FOUNDATION_REASON: ${{ steps.plan.outputs.reason }}
        shell: bash
        run: |
          set -Eeuo pipefail
          app_name="$APP_NAME"
          image="$DEPLOY_IMAGE"
          existing_fqdn=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || true)
          public_url=''
          if [[ -n "$existing_fqdn" ]]; then
            public_url="https://$existing_fqdn"
          fi
          deploy() {
            az deployment group create \
              --name "mafia-app-${GITHUB_RUN_ID}" \
              --mode Incremental \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/app.bicep \
              --parameters \
                location="$AZURE_LOCATION" \
                namePrefix="$AZURE_NAME_PREFIX" \
                databaseName="$AZURE_DATABASE_NAME" \
                image="$image" \
                publicAppUrl="$1" \
                postgresPassword="$POSTGRES_PASSWORD" \
                ghcrUsername="$GHCR_USERNAME" \
                ghcrToken="$GHCR_TOKEN" \
                googleClientId="$GOOGLE_CLIENT_ID" \
                googleClientSecret="$GOOGLE_CLIENT_SECRET" \
                musicTokenEncryptionKey="$MUSIC_TOKEN_ENCRYPTION_KEY" \
              --output none
          }
          deploy "$public_url"
          if [[ -z "$public_url" ]]; then
            fqdn=$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
            public_url="https://$fqdn"
            deploy "$public_url"
          fi
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Azure deployment"
            echo "- Image: \`$image\`"
            echo "- URL: $public_url"
            echo "- Database: ${{ steps.plan.outputs.database_name }}"
            echo "- Infrastructure: $FOUNDATION_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Azure deployment
        env:
          APP_NAME: ${{ steps.plan.outputs.app_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { composeAppVersion } from "./scripts/release-verifier-contracts.mjs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            process.stdout.write(composeAppVersion(version, process.env.GITHUB_RUN_NUMBER));
          ')
          app_name="$APP_NAME"
          configuration=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query '{provisioningState:properties.provisioningState,minReplicas:properties.template.scale.minReplicas,maxReplicas:properties.template.scale.maxReplicas,targetPort:properties.configuration.ingress.targetPort,image:properties.template.containers[0].image,initImage:properties.template.initContainers[0].image}' \
            --output json)
          jq --exit-status --arg image "$DEPLOY_IMAGE" \
            '.provisioningState == "Succeeded" and .minReplicas == 1 and .maxReplicas == 1 and .targetPort == 3000 and .image == $image and .initImage == $image' \
            <<<"$configuration" >/dev/null
          printf '%s\n' "$configuration"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              "${{ steps.app.outputs.public_url }}/health/ready" >/dev/null; then
              identity=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "${{ steps.app.outputs.public_url }}/health/version" 2>/dev/null || true)
              if [[ -n "$identity" ]] && jq --exit-status --arg commit "$GITHUB_SHA" --arg version "$expected_version" \
                '.version == $version and .commit == $commit' \
                <<<"$identity" >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query '[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,image:properties.template.containers[0].image}' \
            --output table || true
          az containerapp logs show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --type system \
            --tail 50 || true
          failed_revision=$(az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query "[?properties.runningState == 'ActivationFailed'].name | [-1]" \
            --output tsv 2>/dev/null || true)
          if [[ -n "$failed_revision" && "$failed_revision" != "null" ]]; then
            az containerapp logs show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --revision "$failed_revision" \
              --container migrate \
              --type console \
              --tail 50 || true
          fi
          exit 1
