name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy staging after publishing
        type: boolean
        default: true
      deploy_infrastructure:
        description: Force infrastructure deployment (otherwise detect changes automatically)
        type: boolean
        default: false
      initialize_storage:
        description: Initialize the explicitly approved empty Storage namespace (never reset)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.AZURE_STAGING_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
      app_version: ${{ steps.version.outputs.app_version }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read baked application version
        id: version
        run: |
          # JavaScript template, not shell expansion.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { composeAppVersion } from "./scripts/release-verifier-contracts.mjs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `app_version=${composeAppVersion(version, process.env.GITHUB_RUN_NUMBER)}\n`);
          '
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_INDEX=${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push immutable image
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          push_output=$(docker push "$IMAGE_REF" 2>&1)
          printf '%s\n' "$push_output"
          if [[ "$push_output" =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
            digest="${BASH_REMATCH[1]}"
          else
            echo "Docker push did not report an image digest" >&2
            exit 1
          fi
          remote_digest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          if [[ "$remote_digest" != "$digest" ]]; then
            echo "Published tag no longer resolves to the pushed digest" >&2
            exit 1
          fi
          image_ref="${IMAGE_REF%:*}@$digest"
          echo "image=$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.AZURE_STAGING_DEPLOY_ENABLED == 'true'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-azure-release.yml
    # GitHub requires inheritance to resolve the called job's environment secrets.
    secrets: inherit
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      commit: ${{ github.sha }}
      build_index: ${{ github.run_number }}
      app_version: ${{ needs.publish.outputs.app_version }}
      deploy_infrastructure: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_infrastructure == true }}
      initialize_storage: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_storage == true }}

  record:
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record successfully verified staging release
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
          STAGING_APP_URL: ${{ needs.deploy.outputs.public_url }}
        run: node scripts/azure-release.mjs record
      - name: Preserve immutable staging release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
