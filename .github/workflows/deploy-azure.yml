name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after verification
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mafia
          POSTGRES_PASSWORD: mafia
          POSTGRES_DB: mafia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mafia -d mafia_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://mafia:mafia@127.0.0.1:5432/mafia_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm run audit:security
      - run: npm run ci:install
      - run: npm run check
      - name: Scan repository dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table

  publish:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the exact image that will be published
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
      - name: Push the scanned immutable image
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          push_output=$(docker push "$IMAGE_REF" 2>&1)
          printf '%s\n' "$push_output"
          if [[ "$push_output" =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
            digest="${BASH_REMATCH[1]}"
          else
            echo "Docker push did not report an image digest" >&2
            exit 1
          fi
          remote_digest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          if [[ "$remote_digest" != "$digest" ]]; then
            echo "Published tag no longer resolves to the pushed digest" >&2
            exit 1
          fi
          image_ref="${IMAGE_REF%:*}@$digest"
          echo "image=$image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && vars.AZURE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MUSIC_TOKEN_ENCRYPTION_KEY: ${{ secrets.MUSIC_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing AZURE_RESOURCE_GROUP}"
          : "${AZURE_LOCATION:?Missing AZURE_LOCATION}"
          : "${AZURE_NAME_PREFIX:?Missing AZURE_NAME_PREFIX}"
          : "${GHCR_USERNAME:?Missing GHCR_USERNAME}"
          : "${GHCR_TOKEN:?Missing GHCR_PULL_TOKEN}"
          : "${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
      - name: Create resource group
        run: >-
          az group create
          --name "$AZURE_RESOURCE_GROUP"
          --location "$AZURE_LOCATION"
          --output none
      - name: Validate Bicep
        run: |
          set -Eeuo pipefail
          az bicep build --file infra/main.bicep
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              deployApp=false \
              postgresPassword="$POSTGRES_PASSWORD" \
              ghcrUsername="$GHCR_USERNAME" \
              ghcrToken="$GHCR_TOKEN" \
              googleClientId="$GOOGLE_CLIENT_ID" \
              googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              musicTokenEncryptionKey="$MUSIC_TOKEN_ENCRYPTION_KEY" \
            --output none
      - name: Deploy foundation
        id: foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          outputs=$(az deployment group create \
            --name "mafia-foundation-${GITHUB_RUN_ID}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              deployApp=false \
              postgresPassword="$POSTGRES_PASSWORD" \
              ghcrUsername="$GHCR_USERNAME" \
              ghcrToken="$GHCR_TOKEN" \
              googleClientId="$GOOGLE_CLIENT_ID" \
              googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              musicTokenEncryptionKey="$MUSIC_TOKEN_ENCRYPTION_KEY" \
            --query properties.outputs \
            --output json)
          app_name=$(jq -r '.containerAppName.value' <<<"$outputs")
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
      - name: Deploy application
        id: app
        shell: bash
        run: |
          set -Eeuo pipefail
          app_name='${{ steps.foundation.outputs.app_name }}'
          image="$DEPLOY_IMAGE"
          existing_fqdn=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || true)
          public_url=''
          if [[ -n "$existing_fqdn" ]]; then
            public_url="https://$existing_fqdn"
          fi
          deploy() {
            az deployment group create \
              --name "mafia-app-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters \
                location="$AZURE_LOCATION" \
                namePrefix="$AZURE_NAME_PREFIX" \
                deployApp=true \
                image="$image" \
                publicAppUrl="$1" \
                postgresPassword="$POSTGRES_PASSWORD" \
                ghcrUsername="$GHCR_USERNAME" \
                ghcrToken="$GHCR_TOKEN" \
                googleClientId="$GOOGLE_CLIENT_ID" \
                googleClientSecret="$GOOGLE_CLIENT_SECRET" \
                musicTokenEncryptionKey="$MUSIC_TOKEN_ENCRYPTION_KEY" \
              --output none
          }
          deploy "$public_url"
          if [[ -z "$public_url" ]]; then
            fqdn=$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
            public_url="https://$fqdn"
            deploy "$public_url"
          fi
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Azure deployment"
            echo "- Image: \`$image\`"
            echo "- URL: $public_url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Azure deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          app_name='${{ steps.foundation.outputs.app_name }}'
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query '{provisioningState:properties.provisioningState,minReplicas:properties.template.scale.minReplicas,maxReplicas:properties.template.scale.maxReplicas,targetPort:properties.configuration.ingress.targetPort}' \
            --output json
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${{ steps.app.outputs.public_url }}/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
