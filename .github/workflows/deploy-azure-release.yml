name: Apply production image

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      commit:
        type: string
        required: true
      build_index:
        type: string
        required: true
      app_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.workflow_ref == format('{0}/.github/workflows/deploy-production.yml@refs/heads/main', github.repository)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_TABLE_NAME: ${{ vars.AZURE_STORAGE_TABLE_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_STORAGE_PARTITION_KEY: ${{ vars.AZURE_STORAGE_PARTITION_KEY }}
      DEPLOY_IMAGE: ${{ inputs.image }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
      APP_BUILD_INDEX: ${{ inputs.build_index }}
      EXPECTED_VERSION: ${{ inputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate release and production target
        run: node scripts/azure-release.mjs validate
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update and verify production image
        run: node scripts/azure-release.mjs deploy
