name: Deploy verified Azure image

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
      commit:
        type: string
        required: true
      build_index:
        type: string
        required: true
      app_version:
        type: string
        required: true
      deploy_infrastructure:
        type: boolean
        default: false
      initialize_storage:
        type: boolean
        default: false
    outputs:
      public_url:
        value: ${{ jobs.deploy.outputs.public_url }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.environment == 'staging' ||
        (inputs.environment == 'production' && github.event_name == 'workflow_dispatch'))
    outputs:
      public_url: ${{ steps.app.outputs.public_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
      APP_BUILD_INDEX: ${{ inputs.build_index }}
      EXPECTED_VERSION: ${{ inputs.app_version }}
      DEPLOY_IMAGE: ${{ inputs.image }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_TABLE_NAME: ${{ vars.AZURE_STORAGE_TABLE_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_STORAGE_PARTITION_KEY: ${{ vars.AZURE_STORAGE_PARTITION_KEY }}
      INITIALIZE_STORAGE: ${{ inputs.initialize_storage }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MUSIC_TOKEN_ENCRYPTION_KEY: ${{ secrets.MUSIC_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module -e 'import { deploymentTarget } from "./scripts/azure-deployment-plan.mjs"; deploymentTarget();'
          if [[ ! "$DEPLOY_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "DEPLOY_IMAGE must be an immutable GHCR image digest" >&2
            exit 1
          fi
          if [[ "$INITIALIZE_STORAGE" != 'true' && "$INITIALIZE_STORAGE" != 'false' ]]; then
            echo "INITIALIZE_STORAGE must be true or false" >&2
            exit 1
          fi
          : "${GHCR_USERNAME:?Missing GHCR_USERNAME}"
          : "${GHCR_TOKEN:?Missing GHCR_PULL_TOKEN}"
      - name: Validate environment binding
        run: node scripts/azure-release.mjs validate-target
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in with environment-specific registry credentials
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
      - name: Verify selected registry digest
        shell: bash
        run: |
          set -Eeuo pipefail
          digest=$(docker buildx imagetools inspect "$DEPLOY_IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" == "${DEPLOY_IMAGE##*@}" ]]
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Select infrastructure deployment
        id: plan
        env:
          DEPLOY_INFRASTRUCTURE: ${{ inputs.deploy_infrastructure == true }}
        run: node scripts/azure-deployment-plan.mjs
      - name: Verify existing deployment target
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(az account show --query id --output tsv)" == "$AZURE_SUBSCRIPTION_ID" ]]
          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          environment_id=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${AZURE_NAME_PREFIX}-app" --query properties.managedEnvironmentId --output tsv)
          expected_environment="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/${AZURE_NAME_PREFIX}-env"
          [[ "${environment_id,,}" == "${expected_environment,,}" ]]
          profile=$(az containerapp env show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${AZURE_NAME_PREFIX}-env" \
            --query "properties.workloadProfiles[?workloadProfileType == 'Consumption'].name | [0]" --output tsv)
          [[ -n "$profile" && "$profile" != 'null' ]]
      - name: Refuse unknown Storage account adoption
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          existing=$(az storage account list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name == '$AZURE_STORAGE_ACCOUNT_NAME'].name | [0]" --output tsv)
          if [[ -n "$existing" && "$existing" != 'null' ]]; then
            recorded=$(az deployment group show --resource-group "$AZURE_RESOURCE_GROUP" \
              --name mafia-foundation \
              --query "properties.{state:provisioningState,account:outputs.storageAccountName.value,app:outputs.containerAppName.value}" --output json)
            jq --exit-status --arg account "$AZURE_STORAGE_ACCOUNT_NAME" --arg app "${AZURE_NAME_PREFIX}-app" \
              '.state == "Succeeded" and .account == $account and .app == $app' <<<"$recorded" >/dev/null
          else
            available=$(az storage account check-name --name "$AZURE_STORAGE_ACCOUNT_NAME" --query nameAvailable --output tsv)
            [[ "$available" == 'true' ]]
          fi
      - name: Validate foundation
        if: steps.plan.outputs.deploy == 'true'
        env:
          FOUNDATION_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        run: |
          set -Eeuo pipefail
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              storageAccountName="$AZURE_STORAGE_ACCOUNT_NAME" \
              storageTableName="$AZURE_STORAGE_TABLE_NAME" \
              storageContainerName="$AZURE_STORAGE_CONTAINER_NAME" \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              foundationFingerprint="$FOUNDATION_FINGERPRINT" \
            --output none
      - name: Inspect foundation changes
        if: steps.plan.outputs.deploy == 'true'
        env:
          FOUNDATION_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          az deployment group what-if \
            --mode Incremental \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              storageAccountName="$AZURE_STORAGE_ACCOUNT_NAME" \
              storageTableName="$AZURE_STORAGE_TABLE_NAME" \
              storageContainerName="$AZURE_STORAGE_CONTAINER_NAME" \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              foundationFingerprint="$FOUNDATION_FINGERPRINT" \
            --no-pretty-print --output json > "$RUNNER_TEMP/foundation-what-if.json"
          jq --exit-status '
            .status == "Succeeded" and (.changes | type == "array") and
            all(.changes[]; .changeType != "Delete" and
              ((.changeType == "NoChange" or .changeType == "Ignore") or
                (.resourceId | test("/providers/Microsoft[.](Storage/storageAccounts|ManagedIdentity/userAssignedIdentities|Authorization/roleAssignments)/"; "i"))))
          ' "$RUNNER_TEMP/foundation-what-if.json" >/dev/null
          jq '[.changes[] | {resourceId, changeType}]' "$RUNNER_TEMP/foundation-what-if.json"
      - name: Deploy foundation
        id: foundation
        if: steps.plan.outputs.deploy == 'true'
        env:
          FOUNDATION_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          az deployment group create \
            --name "mafia-foundation" \
            --mode Incremental \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              storageAccountName="$AZURE_STORAGE_ACCOUNT_NAME" \
              storageTableName="$AZURE_STORAGE_TABLE_NAME" \
              storageContainerName="$AZURE_STORAGE_CONTAINER_NAME" \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              foundationFingerprint="$FOUNDATION_FINGERPRINT" \
            --output none
          record=$(az deployment group show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name mafia-foundation --query 'properties.{state:provisioningState,outputs:outputs}' --output json)
          jq --exit-status --arg fingerprint "$FOUNDATION_FINGERPRINT" \
            --arg account "$AZURE_STORAGE_ACCOUNT_NAME" --arg table "$AZURE_STORAGE_TABLE_NAME" --arg container "$AZURE_STORAGE_CONTAINER_NAME" \
            '.state == "Succeeded" and .outputs.foundationFingerprint.value == $fingerprint and .outputs.storageAccountName.value == $account and .outputs.storageTableName.value == $table and .outputs.storageContainerName.value == $container' <<<"$record" >/dev/null
      - name: Deploy application
        id: app
        env:
          APP_NAME: ${{ steps.plan.outputs.app_name }}
          FOUNDATION_REASON: ${{ steps.plan.outputs.reason }}
        shell: bash
        run: |
          set -Eeuo pipefail
          app_name="$APP_NAME"
          image="$DEPLOY_IMAGE"
          existing_fqdn=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          [[ -n "$existing_fqdn" && "$existing_fqdn" != 'null' ]]
          public_url="https://$existing_fqdn"
          deploy() {
            az deployment group create \
              --name "mafia-app-${GITHUB_RUN_ID}" \
              --mode Incremental \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/app.bicep \
              --parameters \
                location="$AZURE_LOCATION" \
                namePrefix="$AZURE_NAME_PREFIX" \
                storageAccountName="$AZURE_STORAGE_ACCOUNT_NAME" \
                storageTableName="$AZURE_STORAGE_TABLE_NAME" \
                storageContainerName="$AZURE_STORAGE_CONTAINER_NAME" \
                storagePartitionKey="$AZURE_STORAGE_PARTITION_KEY" \
                initializeStorage="$INITIALIZE_STORAGE" \
                image="$image" \
                publicAppUrl="$1" \
                ghcrUsername="$GHCR_USERNAME" \
                ghcrToken="$GHCR_TOKEN" \
                googleClientId="$GOOGLE_CLIENT_ID" \
                googleClientSecret="$GOOGLE_CLIENT_SECRET" \
                musicTokenEncryptionKey="$MUSIC_TOKEN_ENCRYPTION_KEY" \
              --output none
          }
          deploy "$public_url"

          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Azure deployment"
            echo "- Image: \`$image\`"
            echo "- URL: $public_url"
            echo "- Selected commit: $EXPECTED_COMMIT"
            echo "- Selected version: $EXPECTED_VERSION (build $APP_BUILD_INDEX)"
            echo "- Status: applied; readiness and identity verification still pending"
            echo "- Storage: $AZURE_STORAGE_ACCOUNT_NAME / $AZURE_STORAGE_TABLE_NAME / $AZURE_STORAGE_CONTAINER_NAME / $AZURE_STORAGE_PARTITION_KEY"
            echo "- Empty-store initialization requested: $INITIALIZE_STORAGE"
            echo "- Infrastructure: $FOUNDATION_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Azure deployment
        env:
          APP_NAME: ${{ steps.plan.outputs.app_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_version="$EXPECTED_VERSION"
          app_name="$APP_NAME"
          configuration=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query '{provisioningState:properties.provisioningState,minReplicas:properties.template.scale.minReplicas,maxReplicas:properties.template.scale.maxReplicas,targetPort:properties.configuration.ingress.targetPort,image:properties.template.containers[0].image,initImage:properties.template.initContainers[0].image,identity:identity,env:properties.template.containers[0].env,initEnv:properties.template.initContainers[0].env}' \
            --output json)
          if ! jq --exit-status --arg image "$DEPLOY_IMAGE" \
            --arg account "$AZURE_STORAGE_ACCOUNT_NAME" --arg table "$AZURE_STORAGE_TABLE_NAME" \
            --arg container "$AZURE_STORAGE_CONTAINER_NAME" --arg partition "$AZURE_STORAGE_PARTITION_KEY" \
            --arg initialize "$INITIALIZE_STORAGE" \
            --arg identity "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${AZURE_NAME_PREFIX}-storage" '
              def fields: map({key: .name, value: .value}) | from_entries;
              def require(condition; description):
                if condition then . else error("Azure deployment configuration mismatch: " + description) end;
              # Bind before boolean expressions: jq 1.8 changed `as` precedence.
              (.env | fields) as $env | (.initEnv | fields) as $init |
              (.identity.userAssignedIdentities // {} | to_entries[0].value.clientId) as $client |
              require(.provisioningState == "Succeeded"; "provisioning state") |
              require(.minReplicas == 1 and .maxReplicas == 1; "replica count") |
              require(.targetPort == 3000; "ingress port") |
              require(.image == $image and .initImage == $image; "image digest") |
              require(.identity.type == "UserAssigned" and
                ((.identity.userAssignedIdentities | keys | map(ascii_downcase)) == [($identity | ascii_downcase)]) and
                ($client | type == "string") and ($client | length > 0); "Storage identity") |
              require(all([$env, $init][]; .STORAGE_PROVIDER == "azure" and
                .AZURE_STORAGE_ACCOUNT_NAME == $account and .AZURE_STORAGE_TABLE_NAME == $table and
                .AZURE_STORAGE_CONTAINER_NAME == $container and .AZURE_STORAGE_PARTITION_KEY == $partition and
                .AZURE_CLIENT_ID == $client and (has("DATABASE_URL") | not) and (has("AZURE_STORAGE_CONNECTION_STRING") | not));
                "Storage provider, namespace or credentials") |
              require($env.AZURE_STORAGE_INITIALIZE == "false" and $init.AZURE_STORAGE_INITIALIZE == $initialize;
                "Storage initialization") |
              true
            ' <<<"$configuration" >/dev/null; then
            echo "::error::Application deployment was applied, but configuration verification failed." >&2
            exit 1
          fi
          echo "Azure deployment configuration verified."
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              "${{ steps.app.outputs.public_url }}/health/ready" >/dev/null; then
              identity=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "${{ steps.app.outputs.public_url }}/health/version" 2>/dev/null || true)
              if [[ -n "$identity" ]] && jq --exit-status --arg commit "$EXPECTED_COMMIT" --arg version "$expected_version" \
                '.version == $version and .commit == $commit' \
                <<<"$identity" >/dev/null; then
                echo "Verified $RELEASE_ENVIRONMENT release: $EXPECTED_COMMIT / $EXPECTED_VERSION / $DEPLOY_IMAGE" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 10
          done
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query '[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,image:properties.template.containers[0].image}' \
            --output table || true
          az containerapp logs show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --type system \
            --tail 50 || true
          failed_revision=$(az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$app_name" \
            --query "[?properties.runningState == 'ActivationFailed'].name | [-1]" \
            --output tsv 2>/dev/null || true)
          if [[ -n "$failed_revision" && "$failed_revision" != "null" ]]; then
            az containerapp logs show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app_name" \
              --revision "$failed_revision" \
              --container initialize-storage \
              --type console \
              --tail 50 || true
          fi
          exit 1
